buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.77'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
// EN: The legacy MixinGradle plugin has a moving snapshot coordinate; reject different bytes.
// 中文：旧版 MixinGradle 以快照发布；校验已验证的原件，防止静默切换版本。
def mixinPlugin = buildscript.configurations.classpath.resolvedConfiguration.resolvedArtifacts.find {
    it.moduleVersion.id.group == 'org.spongepowered' && it.name == 'mixingradle'
}
def mixinDigest = java.security.MessageDigest.getInstance('SHA-256').digest(mixinPlugin.file.bytes).encodeHex().toString()
if (mixinDigest != '61d4dd3a40eeaf126ac9c5ffdea74c284dfcb34a38baa256f7c99d023a0a04a9') {
    throw new GradleException('Unexpected MixinGradle snapshot: ' + mixinDigest)
}
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = "${addon_version}"
group = 'com.inza.twoh' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'RotP-TheWorldOverHaven'

java.toolchain.languageVersion = JavaLanguageVersion.of(8) // Mojang ships Java 8 to end users, so your mod should target Java 8.

// EN: Read Java sources as UTF-8 regardless of the host's default encoding.
// 中文：始终以 UTF-8 读取 Java 源码，避免系统默认编码导致界面文字乱码。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
// The dev launcher must transform the embedded classes together with TWOH, not as a JVM library.
configurations {
    riftEngineMapped
    compileOnly.extendsFrom(riftEngineMapped)
}
def stageRiftEngine = tasks.register('stageRiftEngine', Sync) {
    from({ zipTree(configurations.riftEngineMapped.singleFile) }) { include '**/*.class' }
    into layout.buildDirectory.dir('rift-engine/userdev')
}
sourceSets.create('riftEngineDev') {
    output.classesDirs.from(files(stageRiftEngine))
}
minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // Channel:   Version:
    // snapshot   YYYYMMDD   Snapshot are built nightly.
    // stable     #          Stables are built at the discretion of the MCP team.
    // official   MCVersion  Official field/method names from Mojang mapping files
    //
    // You must be aware of the Mojang license when using the 'official' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'official', version: '1.16.5'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                twohaddon {
                    source sourceSets.main
                    source sourceSets.riftEngineDev
                }
            }
        }

        server {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                twohaddon {
                    source sourceSets.main
                    source sourceSets.riftEngineDev
                }
            }
        }

        data {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', 'twohaddon', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                twohaddon {
                    source sourceSets.main
                    source sourceSets.riftEngineDev
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        url = uri('https://www.cursemaven.com')
        content { includeGroup 'curse.maven' }
    }
    maven {
        name "RotP Maven"
        url 'https://raw.githubusercontent.com/StandoByte/RotP-maven/main'
    }
    flatDir {
        dirs 'libs', 'vendor/portal-core'
    }
}

mixin {
    add sourceSets.main, 'twohaddon.refmap.json'
    config 'mixins.twohaddon.json'
    config 'mixins.twoh-rift.json'
    config 'mixins.twoh-rift.forge.json'
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.34'

    // You may put jars on which you depend on in ./libs or you may define them like so..
    // compile "some.group:artifact:version:classifier"
    // compile "some.group:artifact:version"

    // Real examples
    // compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    // compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // The 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    // provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // These dependencies get remapped to your current MCP mappings
    // deobf 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    implementation fg.deobf("local:JJBA-RipplesOfThePast:${main_mod_version}")
    riftEngineMapped fg.deobf('local:twoh-rift-engine:1.1')
    compileOnly 'team.unnamed:mocha:3.0.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Example for how to get properties into the manifest for reading by the runtime..
sourceSets {
    embeddiumApi { java.srcDir 'vendor/portal-core/embeddium-api' }
    main.compileClasspath += embeddiumApi.output
}
jar {
    from(zipTree(file('vendor/portal-core/twoh-rift-engine-1.1.jar'))) { include '**/*.class' }
    manifest {
        attributes([
            "Specification-Title": "twohaddon",
            "Specification-Vendor": "Inza",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"Inza",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConnector": "com.inza.twoh.portalcore.RiftMixinConnector",
            "MixinConfigs": "mixins.twohaddon.json,mixins.twoh-rift.json,mixins.twoh-rift.forge.json"
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar') 
tasks.matching { it.name in ['prepareRuns', 'runClient', 'runServer', 'runData'] }.configureEach {
    dependsOn stageRiftEngine
}
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
